# Load GEMINI_API_KEY from the repo-root .env when running locally.
# ./.env covers running from the container, ../.env running from backend/. Both optional.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/hackathondb
spring.datasource.username=postgres
spring.datasource.password=postgres
# Flyway owns the schema (db/migration); Hibernate only checks the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Gemini API. GEMINI_API_KEY has no default on purpose: the app must fail to boot
# with a clear message rather than fail on the first embedding request.
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.embedding-model=gemini-embedding-001
# 768 instead of the model default of 3072: pgvector's HNSW index caps at 2000 dimensions.
gemini.embedding-dimensions=768
# gemini-3.7-flash returned 503 (high demand) and gemini-2.5-flash 404s on this key;
# gemini-3.6-flash answers in ~4s. Verify with GET /v1beta/models before changing.
gemini.chat-model=gemini-3.6-flash
gemini.chat-temperature=0.2
# 4096, não 1024: modelos com "thinking" descontam os tokens de raciocínio deste mesmo
# orçamento, e respostas de listagem (8 itens de agenda) estouravam o limite -> MAX_TOKENS.
gemini.chat-max-output-tokens=4096
gemini.connect-timeout=5s
gemini.read-timeout=20s
# Generation needs far more headroom than embedding.
gemini.chat-read-timeout=60s
# Retry apenas para falhas transitórias (429 e 5xx do provedor, timeouts). 3 tentativas no
# total, com backoff exponencial, limitadas a 90s de tempo total.
gemini.retry-max-attempts=3
gemini.retry-initial-delay=1s
gemini.retry-max-elapsed=90s

# Retrieval tuning. Reference distances measured on the current corpus: a strongly related
# chunk scores ~0.17, unrelated ones ~0.41-0.45, so 0.8 excludes only genuine noise.
rag.top-k=5
rag.max-distance=0.8
# Teto de chunks para perguntas do tipo "liste todos os X" (maior categoria hoje: 8 itens de agenda).
rag.max-enumeration=30

# Origens do frontend autorizadas a chamar a API pelo navegador (React dev server / Vite).
# Nunca use '*': a API não tem autenticação.
app.web.cors-allowed-origins=http://localhost:3000,http://localhost:5173

# Rate limiting. O teto diário global é uma política desta aplicação: sem ele um único usuário
# esgota a cota de IA e derruba a demonstração inteira. O valor 18 foi calibrado contra o que
# medimos no free tier em 18/08/2026 (429 em 20 chamadas generateContent por dia, por modelo) —
# a cota é do provedor e pode mudar sem aviso, então trate 18 como decisão nossa, não como
# espelho de um limite fixo.
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute-per-client=6
app.rate-limit.requests-per-day-total=18
# Login/registro tem janela própria: tentativas de autenticação não podem consumir o orçamento
# diário de IA (senão errar a senha vira uma forma de gastar a cota alheia). 10/min por IP é
# folgado para quem erra a senha e apertado para quem está testando uma lista.
app.rate-limit.auth-requests-per-minute-per-client=10
# Recomendações de agenda: 1 embedding por chamada, nenhuma geração. Janela própria para não
# consumir o teto diário, que existe para proteger a cota de generateContent.
app.rate-limit.recommend-requests-per-minute-per-client=6
# Só ative atrás de um proxy que sobrescreve o header: ele vem do cliente, então confiar nele
# permite forjar um bucket novo por requisição e furar o limite por IP.
app.rate-limit.trust-forwarded-header=false

# Server-side chat memory. One conversation per user, held in Postgres and then deleted: history
# reaches back `ttl`, and turns past it are purged every `cleanup-interval`. Reads filter on the
# same cutoff, so an expired turn cannot reach a prompt even if the purge task never runs.
# max-turns bounds the prompt (history is billed against the same token budget as the answer);
# retrieval-context-turns is how many earlier questions join the embedded text so that a
# follow-up like "e ele fala a que horas?" still retrieves the right chunks. 0 disables that and
# leaves retrieval identical to the single-turn behaviour.
app.chat-memory.enabled=true
app.chat-memory.ttl=1h
app.chat-memory.max-turns=6
app.chat-memory.retrieval-context-turns=2
app.chat-memory.cleanup-interval=15m

# Authentication. Sessions are opaque tokens stored hashed in user_session; the TTL is checked at
# lookup time, so shortening it takes effect for existing sessions immediately. bcrypt-strength is
# the cost factor: each step doubles the work an attacker must spend per guess, and existing hashes
# keep verifying because the factor travels inside the hash.
app.auth.session-ttl=24h
app.auth.bcrypt-strength=10
app.auth.session-purge-period=1h

# Agenda recommendations (POST /api/agenda/recommend). O pool de candidatos é maior que o rag.top-k
# do chat porque o planner descarta candidatos que conflitam de horário — ele precisa de mais do que
# vai devolver. A distância máxima começa igual à do chat, mas é separada de propósito: recomendar
# uma sessão irrelevante é pior que citar um trecho fraco como contexto.
agenda.recommend-top-k=15
agenda.recommend-max-distance=0.8
agenda.default-max-sessions=5
# A agenda tem um item só com horário de início ("12h15"). Sem uma duração assumida ele teria
# tamanho zero e nunca conflitaria com nada — o planner marcaria uma palestra em cima dele.
agenda.open-ended-slot-duration=45m
# O corpus é de um evento de um dia e as linhas da agenda não têm data (só horário), então o filtro
# 'date' da API só pode ser conferido contra isto. Vem de data/evento.json.
agenda.event-date=2026-08-26

# Organizer dashboard. A janela padrão existe porque "desde sempre" num log que só cresce é uma
# varredura sem limite; max-results corta a cauda longa (a ordenação é por demanda, então o corte
# tira o que ninguém está procurando) e a resposta avisa quando cortou.
analytics.default-window=24h
analytics.max-results=50

# Carrega o corpus no boot para que um `docker compose up` limpo já responda. Idempotente: o hash
# de cada chunk é conferido antes de embedar, então reiniciar não gasta cota. Desligue se preferir
# ingerir manualmente por POST /api/ingest (que exige conta).
app.ingestion.on-startup=true
app.ingestion.path=data/evento.json

