# Load GEMINI_API_KEY from the repo-root .env when running locally.
# ./.env covers running from the container, ../.env running from backend/. Both optional.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/hackathondb
spring.datasource.username=postgres
spring.datasource.password=postgres
# Flyway owns the schema (db/migration); Hibernate only checks the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Gemini API. GEMINI_API_KEY has no default on purpose: the app must fail to boot
# with a clear message rather than fail on the first embedding request.
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.embedding-model=gemini-embedding-001
# 768 instead of the model default of 3072: pgvector's HNSW index caps at 2000 dimensions.
gemini.embedding-dimensions=768
# gemini-3.7-flash returned 503 (high demand) and gemini-2.5-flash 404s on this key;
# gemini-3.6-flash answers in ~4s. Verify with GET /v1beta/models before changing.
gemini.chat-model=gemini-3.6-flash
gemini.chat-temperature=0.2
# 4096, não 1024: modelos com "thinking" descontam os tokens de raciocínio deste mesmo
# orçamento, e respostas de listagem (8 itens de agenda) estouravam o limite -> MAX_TOKENS.
gemini.chat-max-output-tokens=4096
gemini.connect-timeout=5s
gemini.read-timeout=20s
# Generation needs far more headroom than embedding.
gemini.chat-read-timeout=60s
# Retry apenas para falhas transitórias (429 e 5xx do provedor, timeouts). 3 tentativas no
# total, com backoff exponencial, limitadas a 90s de tempo total.
gemini.retry-max-attempts=3
gemini.retry-initial-delay=1s
gemini.retry-max-elapsed=90s

# Retrieval tuning. Reference distances measured on the current corpus: a strongly related
# chunk scores ~0.17, unrelated ones ~0.41-0.45, so 0.8 excludes only genuine noise.
rag.top-k=5
rag.max-distance=0.8
# Teto de chunks para perguntas do tipo "liste todos os X" (maior categoria hoje: 8 itens de agenda).
rag.max-enumeration=30

# Origens do frontend autorizadas a chamar a API pelo navegador (React dev server / Vite).
# Nunca use '*': a API não tem autenticação.
app.web.cors-allowed-origins=http://localhost:3000,http://localhost:5173

# Rate limiting. O limite diário global protege a cota do provedor de IA (free tier permite
# apenas 20 chamadas generateContent por dia, por modelo) — sem ele um único usuário derruba
# a demonstração inteira.
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute-per-client=6
app.rate-limit.requests-per-day-total=18
